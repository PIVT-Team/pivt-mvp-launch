# Deploy to Vercel on every push to main.
#
# Why a workflow rather than Vercel's own Git integration: the integration
# broke silently for weeks on the previous repo — pushes sat for 20+ hours with
# no build and no error anywhere visible. A workflow fails loudly in the Actions
# tab, and the deploy is driven from the repo rather than a dashboard setting
# nobody can see.
#
# SETUP — three repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN        vercel.com -> Account Settings -> Tokens
#   VERCEL_ORG_ID       Vercel project -> Settings -> General ("Team ID")
#   VERCEL_PROJECT_ID   Vercel project -> Settings -> General ("Project ID")
#
# And three build-time variables, which are public (they ship in the browser
# bundle; row-level security is what protects the data):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID
#
# Until VERCEL_TOKEN exists the deploy step is skipped, so this file is safe to
# merge now — the build and tests still run on every push.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used in a step-level `if`, so surface the
    # presence of the token as an env var and branch on that instead.
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npx vitest run

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npx vite build

      # Skipped rather than failed when the token is absent, so the workflow is
      # useful as a CI check before deployment is wired up.
      # Link by project NAME rather than by VERCEL_ORG_ID / VERCEL_PROJECT_ID.
      # Those two are hand-copied out of the dashboard and a single wrong
      # character produces "Could not retrieve Project Settings", which gives no
      # hint about which of the two is wrong. The name and team slug are visible
      # in the URL and can be checked by eye.
      - name: Deploy to Vercel
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@latest link --yes \
            --project pivt-mvp-launch-abcef2ed \
            --scope pivt-team \
            --token="${{ secrets.VERCEL_TOKEN }}"
          # No `vercel pull`: it fails when the project has no Production
          # environment variables configured in Vercel, and we don't need them —
          # the build gets its config from the GitHub secrets below.
          npx --yes vercel@latest build --prod \
            --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest deploy --prebuilt --prod \
            --scope pivt-team --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Note when deployment is not configured
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: |
          echo "::notice::Build and tests passed. Deploy skipped — VERCEL_TOKEN is not set."
